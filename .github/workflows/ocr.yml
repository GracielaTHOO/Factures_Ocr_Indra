name: OCR Indra

# Indra télécharge ses poids depuis Hugging Face : ses vrais passages se font ici.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: Nombre de factures générées
        default: "20"
      modele:
        description: Modèle Ollama pour l'extraction par LLM
        default: "qwen2.5:3b"
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml", ".github/workflows/ocr.yml"]

concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    name: Indra sur factures synthétiques
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOMBRE: ${{ inputs.nombre || '20' }}
      MODELE: ${{ inputs.modele || 'qwen2.5:3b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache des poids Indra
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: indra-poids-${{ hashFiles('pyproject.toml') }}
          restore-keys: indra-poids-
      - name: Installation
        run: pip install -e ".[ocr]"
      - name: Factures synthétiques
        run: factocr generer --nombre "$NOMBRE" --dossier data
      - name: OCR (couche texte si présente)
        run: factocr ocr data --mode auto | tee sorties-auto.json
      - name: OCR forcé (même sur les PDF numériques)
        run: factocr ocr data --mode ocr | tee sorties-ocr.json
      - name: Extraction par règles et évaluation
        run: |
          factocr extraire sorties/ocr/indra-auto
          factocr extraire sorties/ocr/indra-ocr
      - name: Installation d'Ollama
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 1; done
          ollama pull "$MODELE"
      - name: Extraction par LLM (scans, OCR forcé)
        # 13 min environ : lancé à la main seulement (Actions > OCR Indra > Run workflow).
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        run: |
          time factocr extraire sorties/ocr/indra-ocr --methode llm --modele "$MODELE" --variante scan
          python -c "import json; r=json.load(open('sorties/extraction/indra-ocr-llm-scan-evaluation.json')); print(json.dumps(r['erreurs'][:30], ensure_ascii=False, indent=1))"
      - name: Résumé
        run: |
          {
            echo "## Indra OCR sur $NOMBRE factures"
            echo
            echo "Mode auto :"
            echo '```json'; cat sorties-auto.json; echo '```'
            echo "Mode ocr :"
            echo '```json'; cat sorties-ocr.json; echo '```'
            echo
            echo "### Exactitude de l'extraction par règles, mode auto"
            cat sorties/extraction/indra-auto-regles-evaluation.md
            echo
            echo "### Exactitude de l'extraction par règles, OCR forcé"
            cat sorties/extraction/indra-ocr-regles-evaluation.md
            echo
            if [ -f sorties/extraction/indra-ocr-llm-scan-evaluation.md ]; then
              echo "### Exactitude de l'extraction par LLM ($MODELE), scans"
              cat sorties/extraction/indra-ocr-llm-scan-evaluation.md
              python -c "import json; print('Origine :', json.load(open('sorties/extraction/indra-ocr-llm-scan-evaluation.json'))['methodes'])"
            fi
            echo
            echo "### Extrait : facture_001 scannée"
            echo '```'
            python -c "from factocr.ocr import DocumentOCR; import pathlib; print(DocumentOCR.depuis_json(pathlib.Path('sorties/ocr/indra-ocr/scan/facture_001.json').read_text()).texte)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-indra
          path: |
            sorties/
            data/verite/
          retention-days: 14
